<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>राजन मलिक | VIP Telegram Channel</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #D4AF37;
      --gold-light: #F7E7A9;
      --gold-dark: #AA771C;
      --gold-gradient: linear-gradient(135deg, #FFE58F 0%, #D4AF37 50%, #996515 100%);
      --telegram-blue: #0088cc;
      --telegram-glow: #24A1DE;
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 33, 0.75);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 136, 204, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 20% 60%, rgba(170, 119, 28, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
      overflow-x: hidden;
      padding: 12px 14px 35px 14px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Top Partner/Agency Header */
    .ar-header {
      width: 100%;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.12), rgba(37, 211, 102, 0.15), rgba(212, 175, 55, 0.12));
      border: 1px solid rgba(212, 175, 55, 0.45);
      padding: 9px 16px;
      border-radius: 50px;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 0 10px rgba(212, 175, 55, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .ar-header:active {
      transform: scale(0.98);
    }

    .ar-badge {
      background: var(--gold-gradient);
      color: #000;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2.5px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .ar-text {
      color: #F7E7A9;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ar-text i.fa-whatsapp {
      color: #25D366;
      font-size: 16px;
      animation: pulse-green 1.8s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #25d366); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 7px #25d366); }
    }

    /* Main Card */
    .vip-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: 26px;
      padding: 26px 20px 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(212, 175, 55, 0.08);
    }

    /* Avatar & DP */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 14px;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #D4AF37, #F7E7A9, #24A1DE, #AA771C, #D4AF37);
      animation: rotate-border 6s linear infinite;
    }

    @keyframes rotate-border {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-inner {
      position: absolute;
      inset: 3px;
      background: #0d111a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.85);
    }

    .avatar-initials {
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .crown-badge {
      position: absolute;
      top: -10px;
      right: 2px;
      background: linear-gradient(135deg, #FFE58F, #D4AF37);
      color: #000;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 2px solid #000;
      z-index: 2;
    }

    /* Profile Names & Titles */
    .name-container {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }

    .main-name {
      font-family: 'Tiro Devanagari Hindi', 'Poppins', serif;
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .verified-icon {
      color: #24A1DE;
      font-size: 20px;
      filter: drop-shadow(0 0 4px rgba(36, 161, 222, 0.7));
    }

    .sub-name {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: #D4AF37;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .tagline-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 11.5px;
      color: #d1d5db;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tagline-pill i {
      color: #D4AF37;
      font-size: 11px;
    }

    /* Stats Grid */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      padding: 9px 4px;
      text-align: center;
    }

    .stat-number {
      font-size: 15px;
      font-weight: 800;
      color: #F7E7A9;
    }

    .stat-label {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 1px;
    }

    /* Timer Widget */
    .timer-widget {
      width: 100%;
      background: rgba(0, 136, 204, 0.08);
      border: 1px dashed rgba(36, 161, 222, 0.45);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .timer-header {
      font-size: 12px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-digits {
      font-size: 22px;
      font-weight: 800;
      color: #24A1DE;
      letter-spacing: 1px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #24A1DE, #0088cc);
      transition: width 1s linear;
    }

    /* CTA Button */
    .cta-btn {
      width: 100%;
      background: linear-gradient(135deg, #0088cc 0%, #006699 50%, #004d73 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 14px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 28px rgba(0, 136, 204, 0.45), 0 0 15px rgba(0, 136, 204, 0.35);
      animation: pulse-cta 1.9s infinite;
      cursor: pointer;
    }

    @keyframes pulse-cta {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 28px rgba(0, 136, 204, 0.45), 0 0 15px rgba(0, 136, 204, 0.3);
      }
      50% {
        transform: scale(1.025);
        box-shadow: 0 12px 36px rgba(0, 136, 204, 0.7), 0 0 25px rgba(0, 136, 204, 0.55);
      }
    }

    .cta-main-text {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .cta-sub-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 3px;
      font-weight: 500;
    }

    /* Footer Trust Details */
    .footer-features {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #94a3b8;
      font-size: 11px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .feature-item i {
      color: #25D366;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar: Powered by AR Advertisement (Updated WhatsApp) -->
    <a href="https://wa.me/916386426321?text=Hello%20AR%20Advertisement%2C%20I%20want%20to%20connect%20with%20you" target="_blank" class="ar-header">
      <span class="ar-badge">OFFICIAL</span>
      <span class="ar-text">
        <i class="fab fa-whatsapp"></i> Powered by AR Advertisement
      </span>
      <i class="fas fa-arrow-right" style="font-size: 11px; color: #D4AF37;"></i>
    </a>

    <!-- Main VIP Profile Card -->
    <div class="vip-card">
      
      <!-- Avatar Section -->
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-inner">
          <div class="avatar-initials">RM</div>
        </div>
        <div class="crown-badge">
          <i class="fas fa-crown"></i>
        </div>
      </div>

      <!-- Identity -->
      <div class="name-container">
        <span class="main-name">राजन मलिक</span>
        <i class="fas fa-check-circle verified-icon"></i>
      </div>
      <div class="sub-name">Rajan Malik Official</div>

      <!-- Tagline -->
      <div class="tagline-pill">
        <i class="fas fa-gem"></i> Premium Luxury VIP Channel
      </div>

      <!-- Quick Metrics -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-number">100%</div>
          <div class="stat-label">Verified</div>
        </div>
        <div class="stat-box">
          <div class="stat-number">VIP</div>
          <div class="stat-label">Access</div>
        </div>
        <div class="stat-box">
          <div class="stat-number">FREE</div>
          <div class="stat-label">Entry</div>
        </div>
      </div>

      <!-- 10-Second Auto Redirect Widget -->
      <div class="timer-widget">
        <div class="timer-header">
          <i class="fas fa-bolt" style="color: #f59e0b;"></i> Auto Redirecting to Telegram in:
        </div>
        <div class="timer-digits" id="countdown">10s</div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- High-Converting CTA Button -->
      <a href="https://telegram.me/+r-34pG4atbowNWM1" id="telegramCta" class="cta-btn">
        <span class="cta-main-text">
          <i class="fab fa-telegram-plane" style="font-size: 21px;"></i> JOIN TELEGRAM NOW
        </span>
        <span class="cta-sub-text">प्रीमियम टेलीग्राम चैनल में अभी जुड़ें (Free VIP Entry)</span>
      </a>

      <!-- Security / Trust Badges -->
      <div class="footer-features">
        <div class="feature-item">
          <i class="fas fa-shield-alt"></i> Safe & Secure
        </div>
        <div class="feature-item">
          <i class="fas fa-user-check"></i> Instant Access
        </div>
      </div>

    </div>
  </div>

  <script>
    // Configuration
    const TELEGRAM_URL = "https://telegram.me/+r-34pG4atbowNWM1";
    let timeLeft = 10;
    const totalTime = 10;
    const countdownEl = document.getElementById("countdown");
    const progressFill = document.getElementById("progressFill");

    // Smooth Countdown & Redirect
    const timerInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft >= 0) {
        countdownEl.textContent = timeLeft + "s";
        const percentage = (timeLeft / totalTime) * 100;
        progressFill.style.width = percentage + "%";
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        countdownEl.textContent = "Opening...";
        // Direct redirect
        window.location.href = TELEGRAM_URL;
      }
    }, 1000);
  </script>
</body>
</html>
